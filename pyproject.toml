[project]
name = "jira-archiver"
# Chronver: YYYY.MM.DD (add .N for a second release on the same day). See CLAUDE.md.
version = "2026.09.29"
description = "Archive Jira Server / Data Center projects as a folder-per-ticket Markdown tree."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "markdownify>=0.13",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.2.3",
]

[project.scripts]
jira-archiver = "jira_archiver.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jira_archiver"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
